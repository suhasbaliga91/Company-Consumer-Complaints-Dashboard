openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cases
    description: Consumer litigation case data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List all cases
      description: Returns all case rows from the registry in the internal normalised shape. Aggregation is done client-side.
      responses:
        "200":
          description: Array of case records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Case:
      type: object
      properties:
        case_number:
          type: string
          description: Unique case identifier
        commission:
          type: string
          description: Forum / bench name
        level:
          type: string
          enum: [district, state, national]
          description: Commission level
        state:
          type: string
          description: State name (title-case); INDIA normalised to NCDRC
        region:
          type: string
          enum: [North, South, East, West, National]
          description: Geographic region derived from state
        case_type:
          type: string
          description: Type of case (Consumer Complaint, First Appeal, etc.)
        case_stage:
          type: string
          description: Raw stage text from registry
        canonical_stage:
          type: string
          enum: [Disposed, "Registered / Admission", "Hearing / Evidence", Arguments, "Order Reserved", Other]
          description: Collapsed canonical stage
        filing_date:
          type: ["string", "null"]
          description: Filing date (ISO 8601)
        next_hearing:
          type: ["string", "null"]
          description: Next hearing date (ISO 8601)
        complainant:
          type: ["string", "null"]
          description: Complainant name
        respondent:
          type: ["string", "null"]
          description: Respondent / co-respondent block
        comp_advocate:
          type: ["string", "null"]
          description: Complainant-side counsel
        resp_advocate:
          type: ["string", "null"]
          description: Respondent-side counsel
        # --- LLM-extracted fields (null until extraction pipeline runs) ---
        extraction_status:
          type: ["string", "null"]
          description: "Extraction pipeline status: null=not run, 'sample'=pilot batch, 'full'=full corpus"
        issue_type:
          type: ["string", "null"]
          description: "Complaint category extracted by LLM (e.g. Vehicle Defect, Service Deficiency)"
        sales_or_service:
          type: ["string", "null"]
          description: "'Sales' or 'Service' — nature of the dispute"
        warranty_related:
          type: ["boolean", "null"]
          description: "True if warranty or AMC is central to the complaint"
        product_model:
          type: ["string", "null"]
          description: "Specific vehicle model mentioned (e.g. Model X)"
        is_ev:
          type: ["boolean", "null"]
          description: "True if the vehicle is an electric vehicle"
        part_involved:
          type: ["string", "null"]
          description: "Specific part or component that failed"
        part_category:
          type: ["string", "null"]
          description: "Broader category of part involved"
        dealership_extracted:
          type: ["string", "null"]
          description: "Dealership name extracted by LLM from judgment text"
        dealership_canonical:
          type: ["string", "null"]
          description: "Dealership name extracted by LLM from respondent field (covers all cases)"
        outcome:
          type: ["string", "null"]
          description: "Final case outcome (Allowed, Dismissed, Partially Allowed, etc.)"
        claim_amount:
          type: ["number", "null"]
          description: "Amount claimed by complainant in INR"
        amount_awarded:
          type: ["number", "null"]
          description: "Amount awarded / directed to be paid in INR"
        grounds_taken:
          type: ["array", "null"]
          items:
            type: string
          description: "Key legal grounds or arguments made by the complainant"
        confidence:
          type: ["number", "null"]
          description: "LLM confidence in extraction quality (0.0–1.0)"
        source_snippet:
          type: ["string", "null"]
          description: "Verbatim excerpt from judgment supporting the key finding"
        # --- Judgment fields (null when judgements table absent or case not yet harvested) ---
        disposal_date:
          type: ["string", "null"]
          description: "Date the order was made / case disposed (ISO 8601)"
        judgement_date:
          type: ["string", "null"]
          description: "Date appearing on the judgment document (ISO 8601)"
        order_body:
          type: ["string", "null"]
          description: "First ~800 characters of the judgment order body"
        bench:
          type: ["array", "null"]
          items:
            type: string
          description: "Names of the presiding member(s) / bench"
        co_respondents:
          type: ["array", "null"]
          items:
            type: string
          description: "Additional respondents listed in the judgment"
        has_judgment:
          type: boolean
          description: "True when the full judgment text (>100 chars) has been harvested"
      required:
        - case_number
        - commission
        - level
        - state
        - region
        - case_type
        - case_stage
        - canonical_stage
